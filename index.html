<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chaos Pong — Gate Prototype</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; border: 2px solid #394363; box-shadow: inset 0 0 0 1px #11182a, inset 0 0 34px #27345d33; }
    #threeGame { position: fixed; inset: 0; display: none; width: 100vw; height: 100vh; border: 2px solid #394363; background: #05070d; }
    #splash { position: fixed; inset: 0; z-index: 5; display: grid; place-items: center; background: radial-gradient(circle at 50% 42%, #12182d 0%, #05070d 58%); }
    .splash-card { width: min(430px, calc(100vw - 42px)); text-align: center; }
    .eyebrow { color: #8290c7; font-size: 11px; letter-spacing: .3em; text-transform: uppercase; margin-bottom: 16px; }
    h1 { margin: 0 0 34px; color: #e9edff; font-size: clamp(48px, 13vw, 86px); line-height: .9; letter-spacing: -.08em; text-transform: lowercase; text-shadow: 0 0 28px #6878ff66; }
    .mode-toggle { display: grid; grid-template-columns: 1fr; gap: 8px; margin-bottom: 20px; }
    .mode { appearance: none; border: 1px solid #29304a; border-radius: 8px; background: #0d1120; color: #9ba6cc; padding: 13px 14px; font: inherit; font-size: 12px; cursor: pointer; }
    .mode.selected { border-color: #51e6ff; color: #e9edff; background: #142539; box-shadow: 0 0 20px #51e6ff1f; }
    #start { appearance: none; border: 0; border-radius: 8px; width: 100%; padding: 15px; background: linear-gradient(100deg, #51e6ff, #8b83ff); color: #06101b; font: inherit; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
    #hud { position: fixed; inset: 0 0 auto; display: flex; justify-content: space-between; padding: 18px 24px; pointer-events: none; text-shadow: 0 2px 12px #000; }
    #population { position: fixed; top: 18px; left: 50%; transform: translateX(-50%); display: flex; gap: 20px; color: #dbe2ff; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; pointer-events: none; text-shadow: 0 2px 12px #000; }
    #population span { white-space: nowrap; }
    #devToggle { position: fixed; right: 18px; bottom: 18px; z-index: 4; border: 1px solid #394363; border-radius: 6px; background: #0d1120dd; color: #aeb9df; padding: 8px 10px; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em; cursor: pointer; }
    #devPanel { position: fixed; right: 18px; bottom: 56px; z-index: 4; display: none; width: 250px; padding: 14px; border: 1px solid #394363; border-radius: 8px; background: #0b1020f2; color: #b7c1e5; box-shadow: 0 12px 36px #0008; font-size: 11px; }
    #devPanel.open { display: block; }
    #devPanel h2 { margin: 0 0 14px; color: #e9edff; font-size: 11px; letter-spacing: .18em; }
    .dev-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 11px 0; }
    .dev-row select { max-width: 135px; border: 1px solid #394363; border-radius: 4px; background: #11182a; color: #dbe2ff; padding: 5px; font: 10px ui-monospace, SFMono-Regular, Menlo, monospace; }
    .dev-row input { accent-color: #ffd166; }
    .player { min-width: 170px; }
    .p2 { text-align: right; }
    .name { font-size: 12px; letter-spacing: .15em; text-transform: uppercase; opacity: .72; }
    .score { font-size: 30px; line-height: 1.1; }
    .meter { width: 170px; height: 5px; margin-top: 8px; background: #1b2030; border-radius: 5px; overflow: hidden; }
    .fill { height: 100%; transform-origin: left; transition: transform .12s linear; }
    #p1fill { background: #51e6ff; } #p2fill { background: #ff5e9c; transform-origin: right; }
    #help { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 11px; opacity: .55; white-space: nowrap; pointer-events: none; }
    #labLaunch { appearance: none; border: 1px solid #394363; border-radius: 8px; width: 100%; margin-top: 10px; padding: 12px; background: #0d1120; color: #aeb9df; font: inherit; font-size: 11px; letter-spacing: .08em; cursor: pointer; }
    #fluidHud { position: fixed; left: 18px; bottom: 18px; z-index: 3; display: none; align-items: center; gap: 10px; padding: 9px 11px; border: 1px solid #394363; border-radius: 6px; background: #0b1020dd; color: #b7c1e5; font-size: 10px; }
    #fluidHud select, #fluidHud button { border: 1px solid #394363; border-radius: 4px; background: #11182a; color: #dbe2ff; padding: 5px; font: inherit; }
    #fluidHud button { cursor: pointer; }
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <canvas id="threeGame"></canvas>
  <section id="splash" aria-label="Chaos Pong start screen">
    <div class="splash-card">
      <div class="eyebrow">a chaotic gate game</div>
      <h1>chaos pong</h1>
      <div class="mode-toggle" role="group" aria-label="Choose game mode">
        <button class="mode selected" data-mode="solo">one player</button>
        <button class="mode" data-mode="computer">one player vs computer</button>
        <button class="mode" data-mode="two">two players</button>
      </div>
      <button id="start">begin</button>
      <button id="labLaunch">open fluid pong lab</button>
    </div>
  </section>
  <div id="hud">
    <div class="player"><div class="name" style="color:#51e6ff">Cyan gate · drag horizontally</div><div class="score" id="p1score">0</div><div class="meter"><div class="fill" id="p1fill"></div></div></div>
    <div class="player p2"><div class="name" id="p2name" style="color:#ff5e9c">Pink gate · A / D</div><div class="score" id="p2score">0</div><div class="meter"><div class="fill" id="p2fill"></div></div></div>
  </div>
  <div id="population" aria-label="Particle population"><span style="color:#51e6ff">cyan <b id="cyanCount">0</b></span><span style="color:#ff5e9c">pink <b id="pinkCount">0</b></span><span>total <b id="totalCount">0</b></span></div>
  <div id="fluidHud" aria-label="Fluid Pong Lab controls"><span>FLUID PONG LAB</span><select id="fluidMode"><option value="inertial">inertial particle</option><option value="front">front element</option><option value="reverse">field reversal</option></select><select id="fluidCount"><option value="1">1 ball</option><option value="2">2 balls</option><option value="10">10 balls</option><option value="100">100 balls</option><option value="400">400 balls</option></select><button id="fluidBack">back</button></div>
  <button id="devToggle" aria-expanded="false">DEV</button>
  <aside id="devPanel" aria-label="Developer options">
    <h2>DEV PANEL</h2>
    <label class="dev-row">Gate size follows
      <select id="gateSizing"><option value="ownership">ownership ratio</option><option value="count">owned count</option><option value="score">total points</option><option value="fixed">fixed size</option></select>
    </label>
    <label class="dev-row">Renderer
      <select id="renderer"><option value="canvas">Canvas 2D</option><option value="three">Three.js 3D</option></select>
    </label>
    <label class="dev-row">Defender <input id="defenderEnabled" type="checkbox"></label>
    <label class="dev-row">Defender action
      <select id="defenderAction"><option value="neutralize">return to neutral</option><option value="kill">kill particle</option></select>
    </label>
  </aside>
  <div id="help">Slide the cyan gate horizontally · catch your own color for 2 points + a split · R resets</div>
  <script src="https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.min.js"></script>
  <script>
    const canvas = document.querySelector('#game'), ctx = canvas.getContext('2d');
    const splash = document.querySelector('#splash'), p2hud = document.querySelector('.p2'), p2name = document.querySelector('#p2name');
    const devToggle = document.querySelector('#devToggle'), devPanel = document.querySelector('#devPanel'), gateSizing = document.querySelector('#gateSizing'), rendererSelect = document.querySelector('#renderer'), defenderEnabled = document.querySelector('#defenderEnabled'), defenderAction = document.querySelector('#defenderAction');
    const cyanCount = document.querySelector('#cyanCount'), pinkCount = document.querySelector('#pinkCount'), totalCount = document.querySelector('#totalCount');
    const p1score = document.querySelector('#p1score'), p2score = document.querySelector('#p2score');
    const p1fill = document.querySelector('#p1fill'), p2fill = document.querySelector('#p2fill');
    const TAU = Math.PI * 2, colors = ['#51e6ff', '#ff5e9c'];
    // Five-times denser sampling keeps the rendered Lorenz path smooth while
    // retaining the fixed-size ring buffer for predictable memory use.
    const TRAIL_POINTS = 40, TRAIL_SAMPLE_SECONDS = .009, TRACK_Y = .50;
    const GATE_MIN_HALF_WIDTH = 18, GATE_MAX_HALF_WIDTH = 92;
    let W, H, scale, particles = [], keys = new Set(), last = 0, paused = false, mode = 'solo', running = false;
    const players = [
      { x: .5, y: TRACK_Y, score: 0, energy: .15, owned: 0, color: colors[0] },
      { x: .5, y: TRACK_Y, score: 0, energy: .15, owned: 0, color: colors[1] }
    ];
    const dev = { gateSizing: 'ownership', renderer: 'canvas', defender: false, defenderAction: 'neutralize' };
    const defender = { x: .5, y: TRACK_Y, halfWidth: 34 };
    const defenderDriver = { x: 3, y: 4, z: 27 };
    const lorenz = { sigma: 10, rho: 28, beta: 8 / 3 };
    const threeCanvas = document.querySelector('#threeGame');
    let threeRenderer, threeScene, threeCamera, threeGroup, threeParticles=[], threeGates=[];
    const fluidHud=document.querySelector('#fluidHud'), fluidModeSelect=document.querySelector('#fluidMode'), fluidCountSelect=document.querySelector('#fluidCount'), fluidBack=document.querySelector('#fluidBack'), labLaunch=document.querySelector('#labLaunch');
    let gameArea='chaos', fluidModel='inertial', fluidClock=0, fluidBalls=[];
    const fluidPaddles=[{y:.5,score:0},{y:.5,score:0}];

    function initThree() {
      if (!window.THREE) return false;
      threeRenderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true });
      threeRenderer.setPixelRatio(Math.min(devicePixelRatio, 2));
      threeRenderer.setSize(innerWidth, innerHeight, false);
      threeScene = new THREE.Scene(); threeScene.background = new THREE.Color('#05070d');
      threeCamera = new THREE.PerspectiveCamera(45, innerWidth/innerHeight, .1, 500);
      threeGroup = new THREE.Group(); threeScene.add(threeGroup);
      return true;
    }
    function syncRenderer() {
      if (dev.renderer === 'three' && !threeRenderer && !initThree()) { dev.renderer='canvas'; rendererSelect.value='canvas'; }
      const useThree = dev.renderer === 'three' && !!threeRenderer;
      canvas.style.display = useThree ? 'none' : 'block'; threeCanvas.style.display = useThree ? 'block' : 'none';
    }
    function drawThree(time) {
      if (!threeRenderer) return;
      const target = new THREE.Vector3(0,0,25), angle=time*.00008;
      threeCamera.position.set(Math.cos(angle)*88, 34+Math.sin(angle*.7)*8, 25+Math.sin(angle)*88); threeCamera.lookAt(target);
      while (threeParticles.length < particles.length) {
        const pointGeometry=new THREE.BufferGeometry(); pointGeometry.setAttribute('position',new THREE.Float32BufferAttribute([0,0,0],3));
        const pointMaterial=new THREE.PointsMaterial({color:'#dbe2ff',size:.9,transparent:true,opacity:.95,sizeAttenuation:true});
        const point=new THREE.Points(pointGeometry,pointMaterial); threeGroup.add(point);
        const lineGeometry=new THREE.BufferGeometry(); lineGeometry.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(TRAIL_POINTS*3),3));
        const line=new THREE.Line(lineGeometry,new THREE.LineBasicMaterial({color:'#dbe2ff',transparent:true,opacity:.5})); threeGroup.add(line);
        threeParticles.push({point,line});
      }
      particles.forEach((q,i)=>{
        const item=threeParticles[i], c=q.owner<0?'#dbe2ff':colors[q.owner]; item.point.material.color.set(c); item.line.material.color.set(c);
        item.point.geometry.attributes.position.array.set([q.x,q.y,q.z]); item.point.geometry.attributes.position.needsUpdate=true;
        const positions=item.line.geometry.attributes.position.array, first=(q.trailHead-q.trailCount+TRAIL_POINTS)%TRAIL_POINTS;
        for(let j=0;j<TRAIL_POINTS;j++){ const src=j<q.trailCount?(first+j)%TRAIL_POINTS:null, o=j*3; if(src===null){positions[o]=q.x;positions[o+1]=q.y;positions[o+2]=q.z;} else {positions[o]=q.trail[src*3];positions[o+1]=q.trail[src*3+1];positions[o+2]=q.trail[src*3+2];} }
        item.line.geometry.attributes.position.needsUpdate=true; item.line.geometry.setDrawRange(0,Math.max(2,q.trailCount));
      });
      threeParticles.forEach((item,i)=>{ item.point.visible=i<particles.length; item.line.visible=i<particles.length; });
      const activePlayers=mode==='solo'?players.slice(0,1):players;
      while(threeGates.length<activePlayers.length+(dev.defender?1:0)){ const mesh=new THREE.Mesh(new THREE.BoxGeometry(2,.45,.9),new THREE.MeshBasicMaterial({color:'#51e6ff',transparent:true,opacity:.85})); threeGroup.add(mesh); threeGates.push(mesh); }
      threeGates.forEach((mesh,i)=>{ const isDefender=dev.defender && i===activePlayers.length, g=isDefender?defender:activePlayers[i]; if(!g){mesh.visible=false;return;} const half=isDefender?defender.halfWidth:gateHalfWidth(i), c=isDefender?'#ffd166':colors[i]; mesh.visible=true; mesh.position.set((g.x-.5)*42,0,15); mesh.scale.set(half/1.2,isDefender?2:1,1); mesh.material.color.set(c); });
      threeRenderer.render(threeScene,threeCamera);
    }

    function fluidFlow(x,y,t) {
      const steadyX=.72*Math.sin(Math.PI*x)*Math.cos(Math.PI*y), steadyY=-.72*Math.cos(Math.PI*x)*Math.sin(Math.PI*y);
      return { steadyX, steadyY, timeX:.13*Math.sin(t*.7+y*8), timeY:.13*Math.cos(t*.55+x*7) };
    }
    function resetFluidBall(b, direction=Math.random()<.5?-1:1) {
      b.x=.5+(Math.random()-.5)*.08; b.y=.2+Math.random()*.6; b.vx=direction*(.28+Math.random()*.12); b.vy=(Math.random()-.5)*.25; b.theta=direction<0?Math.PI:0; b.age=0;
    }
    function launchFluid(count) {
      fluidBalls=[]; fluidClock=0; fluidPaddles[0].score=0; fluidPaddles[1].score=0;
      for(let i=0;i<count;i++){ const b={x:0,y:0,vx:0,vy:0,theta:0,age:0}; resetFluidBall(b,i%2?1:-1); fluidBalls.push(b); }
    }
    function fluidPaddleHit(b, side) {
      const paddle=fluidPaddles[side], hit=Math.abs(b.y-paddle.y)<.13;
      if(!hit){ fluidPaddles[1-side].score++; resetFluidBall(b,side?1:-1); return; }
      b.x=side?.94:.06;
      if(fluidModel==='reverse') b.fieldSign*=-1;
      else if(fluidModel==='front') b.theta=Math.PI-b.theta;
      else b.vx=side?-Math.abs(b.vx):Math.abs(b.vx);
    }
    function updateFluid(dt) {
      fluidClock+=dt;
      fluidPaddles[0].y+=((keys.has('s')?1:0)-(keys.has('w')?1:0))*dt*.5;
      fluidPaddles[1].y+=((keys.has('arrowdown')?1:0)-(keys.has('arrowup')?1:0))*dt*.5;
      fluidPaddles[0].y=Math.max(.12,Math.min(.88,fluidPaddles[0].y));
      fluidPaddles[1].y=Math.max(.12,Math.min(.88,fluidPaddles[1].y));
      for(const b of fluidBalls){
        const flow=fluidFlow(b.x,b.y,fluidClock);
        if(fluidModel==='inertial') { b.vx+=(flow.steadyX+flow.timeX-b.vx)*dt*1.8; b.vy+=(flow.steadyY+flow.timeY-b.vy)*dt*1.8; b.x+=b.vx*dt; b.y+=b.vy*dt; }
        else if(fluidModel==='front') { const target=Math.atan2(flow.steadyY+flow.timeY,flow.steadyX+flow.timeX); let delta=Math.atan2(Math.sin(target-b.theta),Math.cos(target-b.theta)); b.theta+=delta*dt*.7; b.x+=(flow.steadyX+flow.timeX+Math.cos(b.theta)*.42)*dt; b.y+=(flow.steadyY+flow.timeY+Math.sin(b.theta)*.42)*dt; }
        else { if(b.fieldSign===undefined)b.fieldSign=1; b.x+=(b.fieldSign*flow.steadyX+flow.timeX)*dt; b.y+=(b.fieldSign*flow.steadyY+flow.timeY)*dt; }
        b.age+=dt;
        if(b.y<.06||b.y>.94){ b.y=Math.max(.06,Math.min(.94,b.y)); if(fluidModel==='front')b.theta=-b.theta; else b.vy=-b.vy; }
        if(b.x<.035)fluidPaddleHit(b,0); else if(b.x>.965)fluidPaddleHit(b,1);
        if(b.age>30)resetFluidBall(b);
      }
      p1score.textContent=fluidPaddles[0].score; p2score.textContent=fluidPaddles[1].score;
    }
    function drawFluid() {
      ctx.fillStyle='#05070d'; ctx.fillRect(0,0,W,H);
      ctx.save(); ctx.globalAlpha=.16; ctx.strokeStyle='#62709c'; ctx.fillStyle='#8490ba'; ctx.lineWidth=devicePixelRatio;
      for(let ix=1;ix<12;ix++)for(let iy=1;iy<8;iy++){ const x=ix/12,y=iy/8,f=fluidFlow(x,y,fluidClock), sx=x*W,sy=y*H,ex=sx+f.steadyX*24*devicePixelRatio,ey=sy+f.steadyY*24*devicePixelRatio; ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(ex,ey);ctx.stroke();ctx.beginPath();ctx.arc(ex,ey,1.5*devicePixelRatio,0,TAU);ctx.fill(); }
      ctx.restore(); ctx.globalAlpha=.26; ctx.strokeStyle='#8490ba'; ctx.beginPath();ctx.moveTo(W/2,0);ctx.lineTo(W/2,H);ctx.stroke();ctx.globalAlpha=1;
      for(let i=0;i<2;i++){ const x=(i?.96:.04)*W,y=fluidPaddles[i].y*H;ctx.strokeStyle=colors[i];ctx.lineWidth=8*devicePixelRatio;ctx.shadowBlur=12*devicePixelRatio;ctx.shadowColor=colors[i];ctx.beginPath();ctx.moveTo(x,y-.13*H);ctx.lineTo(x,y+.13*H);ctx.stroke(); }
      ctx.shadowBlur=0; for(const b of fluidBalls){ const x=b.x*W,y=b.y*H;ctx.fillStyle='#e8edff';ctx.beginPath();ctx.arc(x,y,Math.min(3,Math.max(1,devicePixelRatio))*devicePixelRatio,0,TAU);ctx.fill(); if(fluidModel==='front'){ctx.strokeStyle='#ffd166';ctx.lineWidth=devicePixelRatio;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(b.theta)*12*devicePixelRatio,y+Math.sin(b.theta)*12*devicePixelRatio);ctx.stroke();} }
    }

    function resize() { W = canvas.width = innerWidth * devicePixelRatio; H = canvas.height = innerHeight * devicePixelRatio; canvas.style.width = innerWidth+'px'; canvas.style.height = innerHeight+'px'; scale = Math.min(W, H) * .021; if(threeRenderer){ threeRenderer.setSize(innerWidth,innerHeight,false); threeCamera.aspect=innerWidth/innerHeight; threeCamera.updateProjectionMatrix(); } }
    addEventListener('resize', resize); resize();
    function recordTrail(q) {
      const offset = q.trailHead * 2;
      q.trail[offset] = q.x; q.trail[offset + 1] = q.y; q.trail[offset + 2] = q.z;
      q.trailHead = (q.trailHead + 1) % TRAIL_POINTS;
      q.trailCount = Math.min(TRAIL_POINTS, q.trailCount + 1);
    }
    function makeParticle(x = (Math.random()-.5)*12, y = (Math.random()-.5)*12, z = 25 + Math.random()*10, owner = -1, vx = 0, vy = 0) {
      const q = { x, y, z, owner, age: 0, cool: .25, vx, vy, wobble: Math.random()*TAU,
        trail: new Float32Array(TRAIL_POINTS * 3), trailHead: 0, trailCount: 0, trailTimer: 0 };
      particles.push(q); recordTrail(q);
    }
    for (let i=0;i<4;i++) makeParticle();

    // Canonical Lorenz view: plot X horizontally against Z vertically.
    // The axes remain at their existing translated position.
    function project(x, y, z) {
      return { x: W/2 + x*scale*1.15, y: H*.72 + 10*scale*1.05 - z*scale*1.05 };
    }
    // The attractor is translated 5 graph-coordinate units below the axes.
    function projectAttractor(x, y, z) {
      return { x: W/2 + x*scale*1.15, y: H*.72 + 15*scale*1.05 - z*scale*1.05 };
    }
    function stepParticle(q, dt) {
      const dx = lorenz.sigma*(q.y-q.x), dy = q.x*(lorenz.rho-q.z)-q.y, dz = q.x*q.y-lorenz.beta*q.z;
      q.x += dx*dt; q.y += dy*dt; q.z += dz*dt;
      q.age += dt; q.cool -= dt;
      // A small physical impulse gives catches a visible, controllable consequence.
      q.x += q.vx*dt; q.y += q.vy*dt; q.vx *= Math.pow(.03, dt); q.vy *= Math.pow(.03, dt);
      q.trailTimer += dt;
      if (q.trailTimer >= TRAIL_SAMPLE_SECONDS) { q.trailTimer %= TRAIL_SAMPLE_SECONDS; recordTrail(q); }
      if (q.age > 26) { q.age = 0; q.x = (Math.random()-.5)*5; q.y = (Math.random()-.5)*5; q.z = 25+Math.random()*8; q.owner = -1; q.trailHead = 0; q.trailCount = 0; q.trailTimer = 0; recordTrail(q); }
    }
    function catchParticle(q, playerIndex) {
      if (q.cool > 0) return;
      const player = players[playerIndex], wasOwn = q.owner === playerIndex;
      player.score += wasOwn ? 2 : 1; player.energy = Math.min(1, player.energy + (wasOwn ? .16 : .1));
      q.owner = playerIndex; q.cool = .7; q.vx = (playerIndex ? -1 : 1) * (2 + Math.random()*2); q.vy = (Math.random()-.5)*3;
      if (wasOwn && particles.length < 200) { makeParticle(q.x+.08, q.y+.08, q.z+.12, playerIndex, q.vx*.5, q.vy*.5); makeParticle(q.x-.08, q.y-.08, q.z-.12, playerIndex, q.vx*.5, q.vy*.5); }
    }
    function gateSizeRatio(playerIndex) {
      if (dev.gateSizing === 'fixed') return 0;
      if (dev.gateSizing === 'count') return Math.min(1, players[playerIndex].owned / 100);
      if (dev.gateSizing === 'score') return Math.min(1, players[playerIndex].score / 100);
      return players[playerIndex].owned / Math.max(1, particles.length);
    }
    function gateHalfWidth(playerIndex) {
      return GATE_MAX_HALF_WIDTH - gateSizeRatio(playerIndex) * (GATE_MAX_HALF_WIDTH - GATE_MIN_HALF_WIDTH);
    }
    function update(dt) {
      if (paused) return;
      if (mode === 'two') {
        players[1].x += ((keys.has('d')?1:0)-(keys.has('a')?1:0))*dt*.3;
      } else if (mode === 'computer') {
        // Deliberately deterministic: a slow, predictable left-right gate.
        players[1].x = .5 + Math.sin(performance.now()*.00125)*.38;
      }
      const activePlayers = mode === 'solo' ? players.slice(0,1) : players;
      for (const p of activePlayers) { p.x = Math.max(.08, Math.min(.92,p.x)); p.y = Math.max(.12, Math.min(.88,p.y)); p.energy = Math.max(0, p.energy - dt*.018); }
      activePlayers.forEach(p => p.y = TRACK_Y);
      const driverDx = lorenz.sigma*(defenderDriver.y-defenderDriver.x), driverDy = defenderDriver.x*(lorenz.rho-defenderDriver.z)-defenderDriver.y, driverDz = defenderDriver.x*defenderDriver.y-lorenz.beta*defenderDriver.z;
      defenderDriver.x += driverDx*dt*.4; defenderDriver.y += driverDy*dt*.4; defenderDriver.z += driverDz*dt*.4;
      defender.x = Math.max(.08, Math.min(.92, projectAttractor(defenderDriver.x,0,0).x/W)); defender.y = TRACK_Y;
      for (let qi=particles.length-1; qi>=0; qi--) {
        const q=particles[qi];
        stepParticle(q, dt*.4); const pt = projectAttractor(q.x,q.y,q.z);
        if (dev.defender && Math.abs(pt.x-defender.x*W)<defender.halfWidth*devicePixelRatio && Math.abs(pt.y-defender.y*H)<22*devicePixelRatio) {
          if (dev.defenderAction === 'kill') particles.splice(qi,1);
          else { q.owner=-1; q.cool=.7; }
          continue;
        }
        let winner = -1, nearest = Infinity;
        for (let i=0;i<activePlayers.length;i++) { const g=activePlayers[i], gx=g.x*W, gy=g.y*H, halfWidth=gateHalfWidth(i)*devicePixelRatio, halfHeight=22*devicePixelRatio, distance=Math.abs(pt.x-gx); if (distance<halfWidth && Math.abs(pt.y-gy)<halfHeight && distance<nearest) { winner=i; nearest=distance; } }
        if (winner >= 0) catchParticle(q,winner);
      }
      if (particles.length < 4) makeParticle();
      let cyan=0, pink=0; for (const q of particles) { if(q.owner===0) cyan++; else if(q.owner===1) pink++; }
      players[0].owned=cyan; players[1].owned=pink;
      cyanCount.textContent=cyan; pinkCount.textContent=pink; totalCount.textContent=particles.length;
      p1fill.style.transform=`scaleX(${(gateHalfWidth(0)-GATE_MIN_HALF_WIDTH)/(GATE_MAX_HALF_WIDTH-GATE_MIN_HALF_WIDTH)})`; p2fill.style.transform=`scaleX(${(gateHalfWidth(1)-GATE_MIN_HALF_WIDTH)/(GATE_MAX_HALF_WIDTH-GATE_MIN_HALF_WIDTH)})`;
      p1score.textContent=players[0].score; p2score.textContent=players[1].score;
    }
    function drawAxes() {
      const origin=project(0,0,0), xEnd=project(24,0,0), xStart=project(-24,0,0), zTop=project(0,0,52);
      ctx.save(); ctx.strokeStyle='#64709a'; ctx.fillStyle='#8490ba'; ctx.lineWidth=devicePixelRatio; ctx.globalAlpha=.42;
      ctx.beginPath(); ctx.moveTo(xStart.x,origin.y); ctx.lineTo(xEnd.x,origin.y); ctx.moveTo(origin.x,origin.y); ctx.lineTo(zTop.x,zTop.y); ctx.stroke();
      ctx.font=`${10*devicePixelRatio}px ui-monospace, SFMono-Regular, Menlo, monospace`;
      ctx.textAlign='center'; ctx.textBaseline='top';
      for (const value of [-20,-10,0,10,20]) { const t=project(value,0,0); ctx.beginPath(); ctx.moveTo(t.x,origin.y-4*devicePixelRatio); ctx.lineTo(t.x,origin.y+4*devicePixelRatio); ctx.stroke(); ctx.fillText(String(value),t.x,origin.y+8*devicePixelRatio); }
      ctx.textAlign='right'; ctx.textBaseline='middle';
      for (const value of [10,20,30,40,50]) { const t=project(0,0,value); ctx.beginPath(); ctx.moveTo(origin.x-4*devicePixelRatio,t.y); ctx.lineTo(origin.x+4*devicePixelRatio,t.y); ctx.stroke(); ctx.fillText(String(value),origin.x-8*devicePixelRatio,t.y); }
      ctx.textAlign='left'; ctx.textBaseline='top'; ctx.fillText('X',xEnd.x+8*devicePixelRatio,origin.y+7*devicePixelRatio);
      ctx.textAlign='left'; ctx.textBaseline='bottom'; ctx.fillText('Z',origin.x+8*devicePixelRatio,zTop.y-6*devicePixelRatio); ctx.restore();
    }
    function draw() {
      // Fully clear each frame: history is visible only through the explicit
      // per-particle trail buffers, not through accumulated canvas overlays.
      ctx.fillStyle='#05070d'; ctx.fillRect(0,0,W,H);
      drawAxes();
      // Batch all trail geometry into three paths, then stroke each color once.
      // This avoids one beginPath/stroke/state change per particle.
      const trailPaths=[new Path2D(),new Path2D(),new Path2D()];
      for (const q of particles) {
        if (q.trailCount < 2) continue;
        const path=trailPaths[q.owner+1];
        const first=(q.trailHead-q.trailCount+TRAIL_POINTS)%TRAIL_POINTS;
        for (let i=0;i<q.trailCount;i++) { const index=(first+i)%TRAIL_POINTS, t=projectAttractor(q.trail[index*3],0,q.trail[index*3+2]); if(i===0) path.moveTo(t.x,t.y); else path.lineTo(t.x,t.y); }
      }
      ctx.globalAlpha=.32; ctx.lineWidth=1.25*devicePixelRatio;
      ['#dbe2ff',colors[0],colors[1]].forEach((c,i)=>{ ctx.strokeStyle=c; ctx.stroke(trailPaths[i]); }); ctx.globalAlpha=1;
      for (const q of particles) {
        const c=q.owner<0?'#dbe2ff':colors[q.owner];
        const pt=projectAttractor(q.x,q.y,q.z); ctx.shadowBlur=12*devicePixelRatio; ctx.shadowColor=c; ctx.fillStyle=c; ctx.beginPath(); ctx.arc(pt.x,pt.y,(q.owner<0?2.2:3.2)*devicePixelRatio,0,TAU); ctx.fill();
      }
      ctx.shadowBlur=0;
      if (dev.defender) { const x=defender.x*W,y=defender.y*H,h=14*devicePixelRatio; ctx.strokeStyle='#ffd166'; ctx.lineWidth=2*devicePixelRatio; ctx.shadowBlur=16*devicePixelRatio; ctx.shadowColor='#ffd166'; ctx.beginPath(); ctx.roundRect(x-defender.halfWidth*devicePixelRatio,y-h/2,defender.halfWidth*2*devicePixelRatio,h,h/2); ctx.stroke(); ctx.fillStyle='#ffd166'; ctx.globalAlpha=.16; ctx.fill(); ctx.globalAlpha=1; ctx.shadowBlur=0; }
      const activePlayers = mode === 'solo' ? players.slice(0,1) : players;
      activePlayers.forEach((g,i)=>{ const x=g.x*W,y=g.y*H,halfWidth=gateHalfWidth(i)*devicePixelRatio,barHeight=7*devicePixelRatio; ctx.strokeStyle=colors[i]; ctx.lineWidth=2*devicePixelRatio; ctx.shadowBlur=18*devicePixelRatio; ctx.shadowColor=colors[i]; ctx.beginPath(); ctx.roundRect(x-halfWidth,y-barHeight/2,halfWidth*2,barHeight,barHeight/2); ctx.stroke(); ctx.fillStyle=colors[i]; ctx.globalAlpha=.16; ctx.fill(); ctx.globalAlpha=1; }); ctx.shadowBlur=0;
    }
    function frame(t) { const dt=Math.min(.035,(t-last)/1000||.016); last=t; if(gameArea==='fluid'){ if(running)updateFluid(dt); drawFluid(); } else { if (running) update(dt); if(dev.renderer==='three') drawThree(t); else draw(); } requestAnimationFrame(frame); } requestAnimationFrame(frame);
    function moveCyanGate(clientX) { players[0].x=clientX/innerWidth; }
    addEventListener('mousemove', e=>moveCyanGate(e.clientX));
    addEventListener('pointermove', e=>{ if (e.pointerType === 'touch' || e.buttons) { if(gameArea==='fluid')fluidPaddles[0].y=e.clientY/innerHeight; else moveCyanGate(e.clientX); } }, { passive: true });
    addEventListener('pointerdown', e=>{ if (e.pointerType === 'touch') { if(gameArea==='fluid')fluidPaddles[0].y=e.clientY/innerHeight; else moveCyanGate(e.clientX); } }, { passive: true });
    addEventListener('keydown', e=>{ keys.add(e.key.toLowerCase()); if(e.key.toLowerCase()==='r') { particles=[]; players.forEach(p=>{p.score=0;p.energy=.15;p.y=TRACK_Y}); for(let i=0;i<4;i++) makeParticle(); } if(e.key===' ') paused=!paused; });
    addEventListener('keyup', e=>keys.delete(e.key.toLowerCase()));
    devToggle.addEventListener('click', () => { const open=devPanel.classList.toggle('open'); devToggle.setAttribute('aria-expanded',String(open)); });
    gateSizing.addEventListener('change', e => { dev.gateSizing=e.target.value; });
    rendererSelect.addEventListener('change', e => { dev.renderer=e.target.value; syncRenderer(); });
    defenderEnabled.addEventListener('change', e => { dev.defender=e.target.checked; });
    defenderAction.addEventListener('change', e => { dev.defenderAction=e.target.value; });
    fluidModeSelect.addEventListener('change', e => { fluidModel=e.target.value; launchFluid(Number(fluidCountSelect.value)); });
    fluidCountSelect.addEventListener('change', e => launchFluid(Number(e.target.value)));
    labLaunch.addEventListener('click', () => { gameArea='fluid'; running=true; splash.style.display='none'; fluidHud.style.display='flex'; p2hud.style.display=''; p2name.textContent='Right paddle'; document.querySelector('#population').style.display='none'; devPanel.classList.remove('open'); launchFluid(Number(fluidCountSelect.value)); });
    fluidBack.addEventListener('click', () => { gameArea='chaos'; running=false; splash.style.display='grid'; fluidHud.style.display='none'; document.querySelector('#population').style.display=''; p2hud.style.display='none'; });
    document.querySelectorAll('.mode').forEach(button => button.addEventListener('click', () => {
      document.querySelectorAll('.mode').forEach(b => b.classList.remove('selected'));
      button.classList.add('selected'); mode = button.dataset.mode;
    }));
    document.querySelector('#start').addEventListener('click', () => {
      running = true; splash.style.display = 'none';
      p2hud.style.display = mode === 'solo' ? 'none' : '';
      p2name.textContent = mode === 'computer' ? 'Pink gate · computer' : 'Pink gate · WASD';
    });
  </script>
</body>
